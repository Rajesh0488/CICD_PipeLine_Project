name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cicdpipeline
  CONTAINER_NAME: flask-app
  APP_PORT: 5000

jobs:

  build-test-deploy:

    runs-on: ubuntu-latest

    environment: AWS key

    steps:

      # ------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------
      # 2. SETUP PYTHON
      # ------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------
      # 3. INSTALL DEPENDENCIES
      # ------------------------------------------------
      - name: Install dependencies
        run: |
          echo "STAGE=Install Dependencies" >> $GITHUB_ENV
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------
      # 4. TEST
      # ------------------------------------------------
      - name: Run pytest
        run: |
          echo "STAGE=Test" >> $GITHUB_ENV
          pytest -v

      # ------------------------------------------------
      # 5. CONFIGURE AWS
      # ------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------
      # 6. LOGIN TO ECR
      # ------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          echo "STAGE=Push" >> $GITHUB_ENV
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      # ------------------------------------------------
      # 7. CREATE IMAGE TAG
      # ------------------------------------------------
      - name: Set image tag
        run: |
          echo "STAGE=Build" >> $GITHUB_ENV
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> $GITHUB_ENV

      # ------------------------------------------------
      # 8. BUILD DOCKER IMAGE
      # ------------------------------------------------
      - name: Build Docker image
        run: |
          echo "STAGE=Build" >> $GITHUB_ENV

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # ------------------------------------------------
      # 9. PUSH IMAGE TO ECR
      # ------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          echo "STAGE=Push" >> $GITHUB_ENV

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ------------------------------------------------
      # 10. DEPLOY TO EC2
      # ------------------------------------------------
      - name: Deploy to EC2
        shell: bash

        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

        run: |
          set -e

          echo "STAGE=Deploy" >> "$GITHUB_ENV"

          echo "Preparing SSH..."

          mkdir -p "$HOME/.ssh"

          # Validate EC2 secrets
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST is empty"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "ERROR: EC2_USER is empty"
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY is empty"
            exit 1
          fi

          echo "EC2_HOST is configured"
          echo "EC2_USER is configured"
          echo "EC2_SSH_KEY is configured"

          # Create SSH private key
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          # Check SSH key
          if ! ssh-keygen -y -f "$HOME/.ssh/ec2_key" > /dev/null 2>&1; then
            echo "ERROR: EC2_SSH_KEY is not a valid private key"
            exit 1
          fi

          echo "SSH private key is valid"

          echo "Testing EC2 host..."

          # Add EC2 host to known_hosts
          echo "Adding EC2 host to known_hosts..."

          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "Connecting to EC2..."

          ssh \
            -i "$HOME/.ssh/ec2_key" \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH connection successful'"

          echo "EC2 SSH connection successful"

      # ------------------------------------------------
      # 11. SUCCESS EMAIL
      # ------------------------------------------------
      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[SUCCESS] Flask CI/CD Deployment - ${{ github.sha }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            CI/CD Deployment Successful

            Application:
            Flask CI/CD Application

            Status:
            SUCCESS

            Branch:
            ${{ github.ref_name }}

            Commit SHA:
            ${{ github.sha }}

            Docker Image:
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

            EC2 Target:
            ${{ secrets.EC2_HOST }}

            Deployment:
            The new Docker image was pulled and started successfully.

            Health Check:
            /health returned HTTP 200.

            Pipeline Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ------------------------------------------------
      # 12. FAILURE EMAIL
      # ------------------------------------------------
      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[FAILURE] Flask CI/CD Pipeline - ${{ github.sha }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            CI/CD Pipeline Failed

            Application:
            Flask CI/CD Application

            Status:
            FAILURE

            Failed Stage:
            ${{ env.STAGE }}

            Branch:
            ${{ github.ref_name }}

            Commit SHA:
            ${{ github.sha }}

            Pipeline Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please open the pipeline run above to investigate the failure.